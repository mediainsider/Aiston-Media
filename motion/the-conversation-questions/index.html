<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Conversation Questions</title>
<style>
  @font-face { font-family: "Poppins"; font-weight: 700; src: url(assets/fonts/poppins-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Poppins"; font-weight: 800; src: url(assets/fonts/poppins-latin-800-normal.woff2) format("woff2"); }

  :root {
    --navy: #081830;
    --navy-deep: #050f22;
    --cyan: #6ee6f7;
    --frame: #2cc8f2;
    --red: #e3161f;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy-deep); }
  body { font-family: "Poppins", sans-serif; }

  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background:
      radial-gradient(760px 620px at 1480px 560px, #0e2a52 0%, transparent 70%),
      radial-gradient(1000px 700px at 200px 1000px, #0a2142 0%, transparent 70%),
      linear-gradient(160deg, #0a1c38 0%, var(--navy) 50%, var(--navy-deep) 100%);
  }
  .abs { position: absolute; }

  /* ---------- ambient particles ---------- */
  #particles { inset: 0; opacity: 0; animation: fadeIn 1.2s ease-out .1s forwards; }
  .p {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(140,225,255,.9) 0%, rgba(140,225,255,0) 70%);
    animation-name: drift; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes drift {
    0%   { transform: translate(0, 0); opacity: 0; }
    15%  { opacity: var(--o); }
    85%  { opacity: var(--o); }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }

  /* ---------- photo ---------- */
  #photo {
    left: 32px; top: 34px; width: 930px; height: 1008px;
    border-radius: 30px 0 0 30px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 80%, rgba(0,0,0,.5) 91%, transparent 100%);
            mask-image: linear-gradient(90deg, #000 0%, #000 80%, rgba(0,0,0,.5) 91%, transparent 100%);
    clip-path: inset(0 100% 0 0);
    animation: wipeIn 1.5s var(--ease-out) .35s forwards;
  }
  #photo .kb1 { position: absolute; inset: 0; transform: scale(1.22); animation: kbIn 2.2s var(--ease-out) .35s forwards; transform-origin: 45% 40%; }
  #photo .kb2 { position: absolute; inset: 0; animation: kbSlow 14s linear .35s both; transform-origin: 40% 45%; }
  #photo img { position: absolute; left: 0; top: -2px; width: 930px; height: 1012px; object-fit: cover; }
  #photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5,15,34,.0) 60%, rgba(5,15,34,.35) 100%); }
  #sun {
    left: 620px; top: 72px; width: 380px; height: 380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,236,170,.85) 0%, rgba(255,170,60,.35) 22%, rgba(255,120,30,0) 62%);
    mix-blend-mode: screen; opacity: 0;
    animation: fadeIn 1s ease-out 1.1s forwards, breathe 3.2s ease-in-out 2.1s infinite;
  }
  #flare {
    left: 380px; top: 290px; width: 900px; height: 18px;
    background: radial-gradient(ellipse at center, rgba(255,226,170,.85) 0%, rgba(255,170,80,.25) 35%, transparent 70%);
    mix-blend-mode: screen; opacity: 0; transform: scaleX(.2);
    animation: flare 2.2s var(--ease-out) 1.25s forwards;
  }
  #shimmer {
    left: 760px; top: 390px; width: 110px; height: 200px;
    background: repeating-linear-gradient(180deg, rgba(255,210,120,.0) 0 14px, rgba(255,220,150,.55) 14px 18px);
    filter: blur(3px); mix-blend-mode: screen; opacity: 0;
    -webkit-mask-image: radial-gradient(closest-side, #000, transparent); mask-image: radial-gradient(closest-side, #000, transparent);
    animation: fadeIn 1s ease-out 1.6s forwards, shimmer 2.4s linear 1.6s infinite;
  }

  /* ---------- frame ---------- */
  #frame { left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
  #frame path {
    fill: none; stroke: var(--frame); stroke-width: 3.5; stroke-linecap: round;
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.8s cubic-bezier(.65,0,.35,1) .15s forwards;
  }
  #frame .glow { stroke-width: 12; opacity: .35; filter: blur(8px); }
  #frame .comet { stroke: #fff; stroke-width: 5; stroke-dasharray: .04 .96; stroke-dashoffset: .04; opacity: 0; filter: drop-shadow(0 0 8px #8ef0ff);
    animation: comet 4.5s linear 2.1s infinite; }

  /* ---------- logo ---------- */
  #logo {
    left: 1556px; top: 14px; width: 330px;
    clip-path: inset(0 100% 0 0); transform: translateY(10px);
    animation: wipeIn 1.1s var(--ease-out) 1.35s forwards, rise 1.1s var(--ease-out) 1.35s forwards;
  }
  #logo img { display: block; width: 100%;
    -webkit-mask-image: radial-gradient(130% 120% at 55% 40%, #000 62%, transparent 80%); mask-image: radial-gradient(130% 120% at 55% 40%, #000 62%, transparent 80%); }
  #logo .shine {
    position: absolute; inset: 0; mix-blend-mode: screen;
    background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%);
    background-size: 300% 100%; background-position: 120% 0;
    -webkit-mask: url(assets/logo.png) center / 100% 100% no-repeat; mask: url(assets/logo.png) center / 100% 100% no-repeat;
    animation: shine 1.2s ease-in-out 2.4s forwards;
  }

  /* ---------- question rows ---------- */
  .icon {
    width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%;
    display: grid; place-items: center;
    transform: scale(0) rotate(-120deg);
    animation: pop .9s var(--ease-back) var(--d) forwards;
  }
  .icon::before { /* soft halo */
    content: ""; position: absolute; inset: -26px; border-radius: 50%;
    background: radial-gradient(circle, var(--c) 0%, transparent 65%); opacity: 0;
    animation: halo 1.6s ease-out var(--d) forwards;
  }
  .icon::after { /* ring pulse */
    content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid var(--c); opacity: 0;
    animation: ring 1.1s var(--ease-out) calc(var(--d) + .15s) forwards;
  }
  .icon .disc { position: absolute; inset: 0; border-radius: 50%; background: var(--c);
    box-shadow: inset 0 -8px 18px rgba(0,0,0,.18), inset 0 6px 14px rgba(255,255,255,.25), 0 10px 30px rgba(0,0,0,.35); }
  .icon svg { position: relative; width: 74px; height: 74px; overflow: visible; }

  #i1 { left: 1046px; top: 241px; --c: #5cc8f1; --d: 2.15s; }
  #i2 { left: 1046px; top: 391px; --c: #f4b512; --d: 3.75s; }
  #i3 { left: 1046px; top: 560px; --c: #8a55e2; --d: 5.35s; }
  #i4 { left: 1046px; top: 799px; --c: #ec2a45; --d: 7.15s; }

  /* icon micro-animations */
  #eyeball { transform-origin: 50% 50%; animation: blink 4s ease-in-out 3.6s infinite; }
  #pupil { animation: look 4s ease-in-out 3.0s infinite; }
  .ray { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .5s ease-out forwards, rayPulse 2.2s ease-in-out infinite; }
  #bulbFill { opacity: 0; animation: bulbOn 2.2s ease-in-out 4.6s infinite; }
  #people .pp { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 2.6s ease-in-out infinite; }
  #heart { transform-origin: 50% 55%; transform-box: fill-box; animation: beat 1.3s ease-in-out 8.2s infinite; }

  .q { left: 1146px; color: #fff; font-weight: 800; letter-spacing: -.012em; line-height: 1.02;
       text-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .q .line { display: block; white-space: nowrap; }
  .q .w { display: inline-block; vertical-align: top; padding-bottom: .3em; margin-bottom: -.3em; clip-path: inset(-1em -1em 0 -1em); }
  .q .w > span { display: inline-block; transform: translateY(115%) rotate(6deg); filter: blur(6px); opacity: 0;
       animation: wordUp .8s var(--ease-out) var(--wd) forwards; }
  .q .hl > span { color: var(--cyan); }
  .q .hl.glow > span { animation: wordUp .8s var(--ease-out) var(--wd) forwards, hlGlow 1.4s ease-out calc(var(--wd) + .6s) forwards; }

  #q1 { top: 202px; font-size: 68px; }
  #q2 { top: 322px; font-size: 66px; }
  #q3 { top: 504px; font-size: 55px; line-height: 1.04; }
  #q4 { top: 744px; font-size: 52px; }
  #q4 .big { font-size: 64px; }

  #brush { left: 1138px; top: 878px; width: 730px; height: 66px; overflow: visible;
    clip-path: inset(0 100% 0 0); animation: wipeIn .75s cubic-bezier(.5,0,.2,1) 8.55s forwards; }


  #vignette { inset: 0; pointer-events: none;
    background: radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.45) 100%); }
  #fadein { inset: 0; background: #000; animation: fadeOut .7s ease-out forwards; pointer-events: none; }

  /* ---------- keyframes ---------- */
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; } }
  @keyframes wipeIn { to { clip-path: inset(0 0 0 0); } }
  @keyframes rise { to { transform: translateY(0); } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes kbIn { to { transform: scale(1.0); } }
  @keyframes kbSlow { from { transform: scale(1); } to { transform: scale(1.06) translate(-10px, -4px); } }
  @keyframes breathe { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .7; transform: scale(1.08); } }
  @keyframes flare { 0% { opacity: 0; transform: scaleX(.2); } 35% { opacity: 1; } 100% { opacity: .25; transform: scaleX(1); } }
  @keyframes shimmer { from { background-position: 0 0; } to { background-position: 0 72px; } }
  @keyframes comet { 0% { opacity: 0; stroke-dashoffset: .04; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; stroke-dashoffset: -.96; } }
  @keyframes shine { to { background-position: -20% 0; } }
  @keyframes pop { to { transform: scale(1) rotate(0deg); } }
  @keyframes halo { 0% { opacity: 0; } 30% { opacity: .9; } 100% { opacity: .35; } }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
  @keyframes wordUp { to { transform: translateY(0) rotate(0); filter: blur(0); opacity: 1; } }
  @keyframes hlGlow { 0% { text-shadow: 0 0 0 rgba(110,230,247,0); } 40% { text-shadow: 0 0 28px rgba(110,230,247,.9); } 100% { text-shadow: 0 0 14px rgba(110,230,247,.35); } }
  @keyframes blink { 0%, 44%, 52%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.08); } }
  @keyframes look { 0%, 20% { transform: translateX(0); } 30%, 55% { transform: translateX(-4px); } 65%, 100% { transform: translateX(0); } }
  @keyframes rayPulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes bulbOn { 0%, 100% { opacity: 0; } 50% { opacity: .9; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.18); } 28% { transform: scale(1); } 42% { transform: scale(1.12); } 60% { transform: scale(1); } }
</style>
</head>
<body>
<div id="stage">
  <div id="particles" class="abs"></div>

  <div id="photo" class="abs">
    <div class="kb1"><div class="kb2">
      <img src="assets/photo.jpg" alt="">
      <div id="sun" class="abs"></div>
      <div id="shimmer" class="abs"></div>
    </div></div>
    <div class="shade"></div>
  </div>
  <div id="flare" class="abs"></div>

  <svg id="frame" class="abs" viewBox="0 0 1920 1080">
    <path pathLength="1" d="M62 34 H1470 C1512 34 1524 52 1544 82 C1566 114 1580 126 1614 126 H1853 Q1885 126 1885 158 V1010 Q1885 1042 1853 1042 H64 Q32 1042 32 1010 V66 Q32 34 62 34 Z" class="glow"/>
    <path pathLength="1" d="M62 34 H1470 C1512 34 1524 52 1544 82 C1566 114 1580 126 1614 126 H1853 Q1885 126 1885 158 V1010 Q1885 1042 1853 1042 H64 Q32 1042 32 1010 V66 Q32 34 62 34 Z"/>
    <path pathLength="1" class="comet" d="M62 34 H1470 C1512 34 1524 52 1544 82 C1566 114 1580 126 1614 126 H1853 Q1885 126 1885 158 V1010 Q1885 1042 1853 1042 H64 Q32 1042 32 1010 V66 Q32 34 62 34 Z"/>
  </svg>

  <div id="logo" class="abs"><img src="assets/logo.png" alt="The Conversation"><div class="shine"></div></div>

  <!-- 1: eye -->
  <div id="i1" class="abs icon"><div class="disc"></div>
    <svg viewBox="-40 -40 80 80">
      <g id="eyeball">
        <path d="M-34 0 C-22 -20 22 -20 34 0 C22 20 -22 20 -34 0 Z" fill="#fff" stroke="#0b1a33" stroke-width="5" stroke-linejoin="round"/>
        <g id="pupil"><circle r="12" fill="#0b1a33"/><circle cx="-4" cy="-4" r="3.5" fill="#fff"/></g>
      </g>
    </svg>
  </div>

  <!-- 2: lightbulb -->
  <div id="i2" class="abs icon"><div class="disc"></div>
    <svg viewBox="-40 -40 80 80">
      <path id="bulbFill" d="M-15 8 C-24 -2 -22 -26 0 -26 C22 -26 24 -2 15 8 C11 12 10 15 10 19 H-10 C-10 15 -11 12 -15 8 Z" fill="#fff6c8"/>
      <path d="M-15 8 C-24 -2 -22 -26 0 -26 C22 -26 24 -2 15 8 C11 12 10 15 10 19 H-10 C-10 15 -11 12 -15 8 Z" fill="none" stroke="#1a1a1a" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M-5 19 V4 L0 -2 L5 4 V19" fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>
      <path d="M-10 25 H10 M-8 31 H8" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
      <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="round">
        <path class="ray" pathLength="1" d="M0 -32 V-38" style="animation-delay:4.35s,4.85s"/>
        <path class="ray" pathLength="1" d="M-20 -27 L-24 -32" style="animation-delay:4.4s,4.9s"/>
      </g>
    </svg>
  </div>

  <!-- 3: people -->
  <div id="i3" class="abs icon"><div class="disc"></div>
    <svg id="people" viewBox="-40 -40 80 80" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <g class="pp" style="animation-delay:6.2s"><circle cx="-21" cy="-6" r="7"/><path d="M-34 18 V14 C-34 8 -30 5 -24 5 H-18"/></g>
      <g class="pp" style="animation-delay:6.5s"><circle cx="21" cy="-6" r="7"/><path d="M34 18 V14 C34 8 30 5 24 5 H18"/></g>
      <g class="pp" style="animation-delay:6.35s"><circle cx="0" cy="-14" r="10"/><path d="M-17 24 V16 C-17 8 -12 4 -5 4 H5 C12 4 17 8 17 16 V24 Z"/></g>
    </svg>
  </div>

  <!-- 4: heart -->
  <div id="i4" class="abs icon"><div class="disc"></div>
    <svg viewBox="-40 -40 80 80">
      <path id="heart" d="M0 28 C-10 20 -32 6 -32 -10 C-32 -22 -22 -29 -13 -29 C-6 -29 -2 -25 0 -21 C2 -25 6 -29 13 -29 C22 -29 32 -22 32 -10 C32 6 10 20 0 28 Z" fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="q1" class="abs q" data-start="2.35"><span class="line">What am I <em class="hl glow">seeing?</em></span></div>
  <div id="q2" class="abs q" data-start="3.95"><span class="line">What might I</span><span class="line"><em class="hl glow">be missing?</em></span></div>
  <div id="q3" class="abs q" data-start="5.55"><span class="line">Who is this person to</span><span class="line">me, <em class="hl glow">beyond the problem</em></span><span class="line"><em class="hl glow">I’m worried about?</em></span></div>
  <div id="q4" class="abs q" data-start="7.35"><span class="line">And then write something</span><span class="line big"><em class="hl glow">you love about them.</em></span></div>

  <svg id="brush" class="abs" viewBox="0 0 730 66">
    <defs>
      <filter id="rough" x="-5%" y="-40%" width="110%" height="180%">
        <feTurbulence type="fractalNoise" baseFrequency=".035 .6" numOctaves="3" seed="7"/>
        <feDisplacementMap in="SourceGraphic" scale="9"/>
      </filter>
      <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#b80d14"/><stop offset=".35" stop-color="#ec1c24"/><stop offset="1" stop-color="#d4121a"/></linearGradient>
    </defs>
    <g filter="url(#rough)">
      <path d="M2 40 C60 30 180 18 380 13 C520 10 640 12 726 20 C700 26 690 30 712 34 C600 38 500 42 400 45 C270 49 150 54 60 58 C30 59 12 56 4 50 Z" fill="url(#bg)"/>
      <path d="M30 40 C170 30 400 26 700 26" stroke="#ff4a50" stroke-width="2.5" fill="none" opacity=".6"/>
      <path d="M60 48 C220 40 430 34 650 33" stroke="#8f0a10" stroke-width="2" fill="none" opacity=".55"/>
      <path d="M560 36 C620 37 670 38 712 40" stroke="#d4121a" stroke-width="3" fill="none" opacity=".8"/>
      <path d="M20 52 C60 50 90 50 140 48" stroke="#c8101a" stroke-width="2" fill="none" opacity=".7"/>
    </g>
  </svg>

  <div id="vignette" class="abs"></div>
  <div id="fadein" class="abs"></div>
</div>

<script>
  // Split question lines into words, each word gets a staggered reveal delay.
  document.querySelectorAll(".q").forEach(q => {
    let t = parseFloat(q.dataset.start);
    q.querySelectorAll(".line").forEach(line => {
      const parts = [];
      line.childNodes.forEach(n => {
        const hl = n.nodeType === 1;
        const cls = hl ? n.className : "";
        n.textContent.split(/(\s+)/).forEach(tok => { if (tok) parts.push({ tok, cls }); });
      });
      line.innerHTML = "";
      parts.forEach(({ tok, cls }) => {
        if (/^\s+$/.test(tok)) { line.append(" "); return; }
        const w = document.createElement("span");
        w.className = "w " + cls;
        w.style.setProperty("--wd", t.toFixed(2) + "s");
        const inner = document.createElement("span");
        inner.textContent = tok;
        w.append(inner);
        line.append(w);
        t += 0.075;
      });
      t += 0.06;
    });
  });

  // Deterministic ambient particles.
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const box = document.getElementById("particles");
  for (let i = 0; i < 46; i++) {
    const p = document.createElement("span");
    p.className = "p";
    const s = 3 + rnd() * 9, dur = 7 + rnd() * 8;
    Object.assign(p.style, {
      left: (rnd() * 1920) + "px", top: (200 + rnd() * 900) + "px",
      width: s + "px", height: s + "px",
      animationDuration: dur + "s", animationDelay: (-rnd() * dur) + "s",
    });
    p.style.setProperty("--dx", (rnd() * 120 - 60) + "px");
    p.style.setProperty("--dy", (-160 - rnd() * 260) + "px");
    p.style.setProperty("--o", (.15 + rnd() * .45).toFixed(2));
    box.append(p);
  }

  // Frame-accurate seeking for the renderer.
  window.seek = t => document.getAnimations().forEach(a => { a.pause(); a.currentTime = t * 1000; });
  window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
</script>
</body>
</html>
